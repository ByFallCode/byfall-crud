name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            php: '8.2'
            framework: '^12.69.2'
            testbench: '^10.12'
            phpunit: '^11.5.50'
          - laravel: '13'
            php: '8.3'
            framework: '^13.32.0'
            testbench: '^11.3'
            phpunit: '^12.5.8'
          - laravel: '13'
            php: '8.5'
            framework: '^13.32.0'
            testbench: '^11.3'
            phpunit: '^12.5.8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate manifest before matrix adaptation
        run: composer validate --strict --no-check-lock

      - name: Select the matrix dependencies
        shell: bash
        run: |
          composer config --unset platform.php
          if composer config platform.php >/dev/null 2>&1; then
            echo "config.platform.php still masks the job PHP version" >&2
            exit 1
          fi
          composer require --dev --no-update \
            "laravel/framework:${{ matrix.framework }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Resolve this combination independently
        run: composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: Display installed versions
        shell: bash
        run: |
          php --version
          composer --version
          composer show laravel/framework
          composer show orchestra/testbench
          composer show phpunit/phpunit

      - name: Verify the real platform
        run: composer check-platform-reqs

      - name: Run the complete test suite
        run: composer test
